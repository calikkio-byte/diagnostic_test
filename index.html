<title>2M Digital Consulting — iPhone Check Tool</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f4f6fb;--card:#ffffff;--muted:#5c6475;--text:#0f172a;--border:#e3e7ef;--soft:#eef1f8;
    --ok:#15803d;--warn:#b45309;--bad:#dc2626;--accent:#2563eb;--accent2:#22d3ee;
    --shadow:0 6px 20px rgba(15,23,42,.06);--safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1020;--card:#141b30;--muted:#98a2bd;--text:#e9edf8;--border:#26314e;--soft:#1b2440;
      --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--accent:#60a5fa;--shadow:0 6px 20px rgba(0,0,0,.35)}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation}
  button,input,select,textarea{font:inherit;color:inherit}
  .container{max-width:880px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(clamp(12px,2vw,20px),env(safe-area-inset-right)) calc(138px + var(--safe-b)) max(clamp(12px,2vw,20px),env(safe-area-inset-left))}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:16px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  h1{font-size:17px;line-height:1.2;margin:0}
  h2{margin:0;font-size:18px}
  h3{margin:0}
  .sub{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tile{appearance:none;text-align:left;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px;min-height:124px;padding:14px 12px 12px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:transform .08s}
  .tile:active{transform:scale(.98)}
  .tile:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
  .tile .ic{font-size:26px;line-height:1;margin-top:18px}
  .tile h3{font-size:14px}
  .pill{font-size:11px;color:var(--muted)}
  .chip{position:absolute;top:9px;left:12px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted)}
  .chip i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--soft);font-size:10px}
  .tile[data-s=ok] .chip{color:var(--ok)} .tile[data-s=ok] .chip i{background:var(--ok);color:#fff}
  .tile[data-s=warn] .chip{color:var(--warn)} .tile[data-s=warn] .chip i{background:var(--warn);color:#fff}
  .tile[data-s=bad] .chip{color:var(--bad)} .tile[data-s=bad] .chip i{background:var(--bad);color:#fff}
  .tile[data-s=ok]{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
  .tile[data-s=warn]{border-color:color-mix(in srgb,var(--warn) 55%,var(--border))}
  .tile[data-s=bad]{border-color:color-mix(in srgb,var(--bad) 60%,var(--border))}
  .bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .footer{position:fixed;inset:auto 0 0;z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 88%,transparent);border-top:1px solid var(--border);padding:10px max(10px,env(safe-area-inset-right)) calc(8px + var(--safe-b)) max(10px,env(safe-area-inset-left))}
  .footer .row{max-width:880px;margin:0 auto 6px}
  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1 1 auto;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 10px;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#0891b2);border-color:transparent;color:#fff}
  .btn.grow{flex:2 1 0}
  .btn.ok{border-color:var(--ok);color:var(--ok)} .btn.warn{border-color:var(--warn);color:var(--warn)} .btn.bad{border-color:var(--bad);color:var(--bad)}
  .btn.suggest{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 30%,transparent);background:color-mix(in srgb,currentColor 10%,var(--card))}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn[disabled]{opacity:.5}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
  .sheet{background:var(--card);border-top-left-radius:18px;border-top-right-radius:18px;max-height:92dvh;max-height:92vh;overflow:auto;overscroll-behavior:contain;width:100%;max-width:880px;padding:0 16px calc(16px + var(--safe-b));border-top:1px solid var(--border)}
  @supports (height:1dvh){.sheet{max-height:92dvh}}
  .sheet-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;background:var(--card)}
  .sheet p{color:var(--muted);font-size:14px;margin:6px 0 10px}
  .row{display:flex;gap:8px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .center{text-align:center}
  .field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .field input,.field select,.field textarea,select{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:16px;width:100%;min-height:44px}
  .field.half{flex:1 1 140px;min-width:0}
  select{width:auto;flex:1 1 140px}
  video,canvas{max-width:100%;border-radius:12px;border:1px solid var(--border)}
  video{width:100%;background:#000;margin-top:8px}
  .small{font-size:12px;color:var(--muted)} .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
  .kbd{background:var(--card);border:1px solid var(--border);border-bottom-width:3px;padding:1px 6px;border-radius:6px;font-weight:700;font-size:13px}
  a{color:var(--accent)}
  .checks label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:12px;margin:6px 0;font-size:14px;cursor:pointer}
  .checks input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
  .resultbar{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}
  .tip{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-size:13px;background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:14px;padding:10px 12px;margin-bottom:12px}
  .tip[hidden]{display:none}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  .st{font-weight:700;white-space:nowrap} .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.none{color:var(--muted)}
  .sig{width:100%;height:150px;background:#fff;touch-action:none;cursor:crosshair}
  .level{position:relative;width:170px;height:170px;margin:10px auto;border:2px solid var(--border);border-radius:50%;background:var(--soft)}
  .level::before,.level::after{content:"";position:absolute;background:var(--border)}
  .level::before{left:50%;top:0;bottom:0;width:1px}.level::after{top:50%;left:0;right:0;height:1px}
  .level i{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);left:50%;top:50%;transition:left .08s,top .08s}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border)}
  .hrow .btn{flex:0 0 auto;padding:8px 10px;min-height:36px;font-size:13px}
  #toast{position:fixed;left:50%;bottom:calc(120px + var(--safe-b));transform:translateX(-50%) translateY(20px);z-index:90;background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #colorOverlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0 0 calc(24px + var(--safe-b));cursor:pointer;touch-action:manipulation}
  #colorOverlay span{font-size:13px;color:#fff;mix-blend-mode:difference;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  #printReport{display:none}
  @media print{
    :root{color-scheme:light}
    html,body{background:#fff!important;color:#000!important}
    .container,.footer,.modal,#toast,#colorOverlay{display:none!important}
    #printReport{display:block;font:12px/1.4 ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;color:#000}
    #printReport h1{font-size:20px;margin:0}
    #printReport .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2563eb;padding-bottom:8px;margin-bottom:10px}
    #printReport table{width:100%;border-collapse:collapse;margin:8px 0}
    #printReport td,#printReport th{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left;vertical-align:top}
    #printReport .st.ok{color:#15803d}#printReport .st.warn{color:#b45309}#printReport .st.bad{color:#dc2626}#printReport .st.none{color:#666}
    #printReport .pf{display:flex;gap:24px;align-items:flex-end;margin-top:14px;page-break-inside:avoid}
    #printReport .pf>div{flex:1}
    #printReport img{max-width:100%}
    #printReport .legal{font-size:10px;color:#555;margin-top:14px}
    @page{margin:14mm}
  }
</style>

    <header>
      <div class="brand">

    <div class="tip" id="install" hidden>

    <section class="card" aria-label="Scheda controllo">
      <div class="row wrap">
        <div class="field half"><label class="small" for="customer">Cliente</label><input id="customer" autocomplete="off" placeholder="Nome e cognome" maxlength="80" /></div>

          <datalist id="models">
            <option value="iPhone 11"></option><option value="iPhone 11 Pro"></option><option value="iPhone 11 Pro Max"></option>

            <option value="iPhone 12 mini"></option><option value="iPhone 12"></option><option value="iPhone 12 Pro"></option><option value="iPhone 12 Pro Max"></option>
            <option value="iPhone 13 mini"></option><option value="iPhone 13"></option><option value="iPhone 13 Pro"></option><option value="iPhone 13 Pro Max"></option>
            <option value="iPhone 14"></option><option value="iPhone 14 Plus"></option><option value="iPhone 14 Pro"></option><option value="iPhone 14 Pro Max"></option>
            <option value="iPhone 15"></option><option value="iPhone 15 Plus"></option><option value="iPhone 15 Pro"></option><option value="iPhone 15 Pro Max"></option>
            <option value="iPhone 16e"></option><option value="iPhone 16"></option><option value="iPhone 16 Plus"></option><option value="iPhone 16 Pro"></option><option value="iPhone 16 Pro Max"></option>
            <option value="iPhone 17"></option><option value="iPhone Air"></option><option value="iPhone 17 Pro"></option><option value="iPhone 17 Pro Max"></option>
          </datalist>
        </div>
      </div>
      <div class="row" style="justify-content:space-between;margin:6px 0 4px"><span class="small" id="progTxt">0/14 test completati</span><span class="small" id="scoreTxt"></span></div>
      <div class="bar" role="progressbar" aria-label="Avanzamento controlli"><i id="progBar"></i></div>
    </section>

    <div class="grid" id="grid"></div>

    <div class="field" style="margin-top:14px">
      <label class="small" for="notes">Note finali per il report</label>
      <textarea id="notes" rows="3" maxlength="1000" placeholder="Annotazioni sull’esito dei test…"></textarea>
    </div>
  </div>

  <div class="footer">
    <div class="row">
      <button class="btn" id="btnNew">＋ Nuovo</button>
      <button class="btn" id="btnHist">🕘 Cronologia</button>
      <button class="btn primary grow" id="btnFinal">Finalizza &amp; report</button>
    </div>
    <div class="small center">© <span id="yr">2025</span> 2M Digital Consulting SRLS — <a href="https://www.2m-srls.com" target="_blank" rel="noopener">www.2m-srls.com</a></div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet" id="sheet">
      <div class="sheet-head">
        <h2 id="sheetTitle">—</h2>
        <button class="btn" id="closeSheet" style="flex:0 0 auto;padding:8px 14px" aria-label="Chiudi">Chiudi</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="printReport" aria-hidden="true"></div>

<script>
(()=>{
'use strict';

/* ===================== Utilità ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const pad=n=>String(n).padStart(2,'0');
const fmtDate=ts=>{const d=new Date(ts);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
const fmtBytes=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(2)+' MB':(n/1e3).toFixed(2)+' KB';
const luhn=s=>{let sum=0,alt=false;for(let i=s.length-1;i>=0;i--){let d=+s[i];if(alt){d*=2;if(d>9)d-=9}sum+=d;alt=!alt}return sum%10===0};
const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).toUpperCase().padStart(14,'0')};
const newId=()=>Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}

/* ===================== Dati ===================== */
const TESTS=[
  {id:'audio',   icon:'🔊',title:'Audio & Microfono',   hint:'tono, meter, registrazione'},
  {id:'buttons', icon:'🔘',title:'Tasti fisici',        hint:'volume, laterale, silenzioso'},
  {id:'charging',icon:'🔌',title:'Ricarica',            hint:'cavo, wireless, porta'},
  {id:'wireless',icon:'📶',title:'Wireless & rete',     hint:'ping, Wi‑Fi, Bluetooth, SIM'},
  {id:'touch',   icon:'👆',title:'Touch screen',        hint:'griglia + multitouch'},
  {id:'display', icon:'🖥️',title:'Display',             hint:'pixel morti, macchie'},
  {id:'camera',  icon:'📷',title:'Fotocamere',          hint:'anteprima e scatto'},
  {id:'sensors', icon:'🧭',title:'Sensori',             hint:'movimento, giroscopio'},
  {id:'security',icon:'🔒',title:'Sicurezza & iCloud',  hint:'blocco attivazione, MDM'},
  {id:'parts',   icon:'🧩',title:'Parti & originalità', hint:'cronologia assistenza'},
  {id:'battery', icon:'🔋',title:'Batteria',            hint:'capacità e cicli'},
  {id:'storage', icon:'💾',title:'Memoria interna',     hint:'capacità dichiarata'},
  {id:'logs',    icon:'📝',title:'Log & crash',         hint:'analisi file .ips'},
  {id:'device',  icon:'📱',title:'Info dispositivo',    hint:'modello, SN, IMEI'}
];
const LABEL={ok:'OK',warn:'Attenzione',bad:'Problema'};
const STAT={none:'Da fare',...LABEL};
const SYM={none:'•',ok:'✓',warn:'!',bad:'✕'};
const KEY='iphone_check_state_v2', OLDKEY='iphone_check_state', HKEY='iphone_check_history_v1';

function jget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}

let state=jget(KEY,null)||jget(OLDKEY,{});
if(!state.id){state.id=newId()}
if(!state.startedAt){state.startedAt=Date.now()}
let saveWarned=false;
function persist(){if(!jset(KEY,state)&&!saveWarned){saveWarned=true;toast('Memoria del browser piena: esporta i dati.')}}
function setState(p){Object.assign(state,p);persist();render()}
function patch(id,p){state[id]={...(state[id]||{}),...p};persist();render()}
function setStatus(id,val){const o={...(state[id]||{})};if(val){o.status=val;o.ts=Date.now()}else{delete o.status;delete o.ts}state[id]=o;persist();render()}

function computeScore(){
  let pts=0,done=0,bad=0;
  for(const t of TESTS){const s=state[t.id]?.status;if(s)done++;if(s==='ok')pts+=1;else if(s==='warn')pts+=.5;else if(s==='bad')bad++}
  const total=TESTS.length,percent=Math.round(pts/total*100);
  let verdict=percent>=90?'Eccellente':percent>=75?'Buono':percent>=60?'Discreto':'Da rivedere';
  if(bad&&(verdict==='Eccellente'||verdict==='Buono'))verdict='Discreto';
  if(state.security?.status==='bad')verdict='Non idoneo';
  return {points:pts,total,done,bad,percent,verdict,complete:done===total};
}

/* ===================== Interfaccia principale ===================== */
const tiles={};
for(const t of TESTS){
  const b=el(`<button class="tile" data-test="${t.id}" data-s="none"><span class="chip"><i></i><b></b></span><span class="ic" aria-hidden="true">${t.icon}</span><h3>${t.title}</h3><span class="pill">${t.hint}</span></button>`);
  b.onclick=()=>H[t.id]();
  $('#grid').append(b);tiles[t.id]=b;
}
const sync=(sel,v)=>{const e=$(sel);if(e&&document.activeElement!==e&&e.value!==(v||''))e.value=v||''};
function render(){
  for(const t of TESTS){
    const s=state[t.id]?.status||'none',b=tiles[t.id];
    b.dataset.s=s;$('.chip i',b).textContent=SYM[s];$('.chip b',b).textContent=STAT[s];
    b.setAttribute('aria-label',`${t.title}: ${STAT[s]}`);
  }
  const sc=computeScore();
  $('#progBar').style.width=(sc.done/sc.total*100)+'%';
  $('#progTxt').textContent=`${sc.done}/${sc.total} test completati`;
  $('#scoreTxt').textContent=`Punteggio ${sc.percent}% · ${sc.verdict}${sc.complete?'':' (provvisorio)'}`;
  sync('#customer',state.customer);sync('#model',state.device?.model);sync('#notes',state.notes);
  $('#deviceName').textContent=state.device?.model||navigator.platform||'—';
}
$('#customer').addEventListener('input',e=>setState({customer:e.target.value}));
$('#model').addEventListener('input',e=>patch('device',{model:e.target.value}));
$('#notes').addEventListener('input',e=>setState({notes:e.target.value}));
$('#yr').textContent=new Date().getFullYear();

/* ===================== Sheet (finestra modale) ===================== */
const modal=$('#modal'),sheet=$('#sheet'),sheetBody=$('#sheetBody');
let sheetCleanup=null,lastFocus=null,wake=null;
async function requestWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch{}}
function releaseWake(){try{wake&&wake.release()}catch{}wake=null}
function openSheet(title,node,onClose){
  closeSheet(true);
  lastFocus=document.activeElement;
  $('#sheetTitle').textContent=title;sheetBody.replaceChildren(node);
  modal.style.display='flex';document.body.style.overflow='hidden';
  sheetCleanup=onClose||null;sheet.scrollTop=0;$('#closeSheet').focus();requestWake();
}
function closeSheet(silent){
  if(modal.style.display!=='flex')return;
  try{sheetCleanup&&sheetCleanup()}catch(e){console.warn(e)}
  sheetCleanup=null;modal.style.display='none';sheetBody.replaceChildren();
  document.body.style.overflow='';releaseWake();
  if(silent!==true&&lastFocus&&lastFocus.focus)lastFocus.focus();
}
modal.addEventListener('click',e=>{if(e.target===modal)closeSheet()});
$('#closeSheet').onclick=()=>closeSheet();
modal.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Tab'){
    const f=$$('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])',sheet).filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
});

/* Barra esito (OK / Attenzione / Problema) con nota facoltativa */
function resultBar(id){
  const n=el(`<div class="resultbar">
    <div class="field"><label class="small" for="note-${id}">Nota facoltativa (finisce nel report)</label><input id="note-${id}" type="text" maxlength="200" placeholder="es. microfono posteriore attutito" /></div>
    <div class="row wrap"><button class="btn ok" data-s="ok">✓ OK</button><button class="btn warn" data-s="warn">! Attenzione</button><button class="btn bad" data-s="bad">✕ Problema</button></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-s="">Azzera esito</button></div></div>`);
  const note=$('input',n);note.value=state[id]?.note||'';
  note.addEventListener('input',()=>patch(id,{note:note.value.trim()}));
  $$('[data-s]',n).forEach(b=>b.onclick=()=>{patch(id,{note:note.value.trim()});setStatus(id,b.dataset.s);closeSheet()});
  n.suggest=s=>$$('[data-s]',n).forEach(b=>b.classList.toggle('suggest',!!s&&b.dataset.s===s));
  return n;
}
function checklist(id,items,onChange){
  const saved=state[id]?.checks||{};
  const n=el(`<div class="checks">${items.map(([k,l])=>`<label><input type="checkbox" data-k="${k}" ${saved[k]?'checked':''} /><span>${l}</span></label>`).join('')}</div>`);
  n.counts=()=>({n:$$('input:checked',n).length,t:items.length});
  n.addEventListener('change',()=>{const c={};$$('input',n).forEach(i=>c[i.dataset.k]=i.checked);patch(id,{checks:c});onChange&&onChange(n.counts())});
  return n;
}
function checklistTest(id,title,intro,items,extra){
  const wrap=el('<div></div>');
  wrap.append(el(`<p>${intro}</p>`));
  if(extra)wrap.append(extra);
  const bar=resultBar(id);
  const cl=checklist(id,items,c=>bar.suggest(c.n===c.t?'ok':null));
  wrap.append(cl,bar);
  const c0=cl.counts();bar.suggest(c0.n===c0.t?'ok':null);
  openSheet(title,wrap);
}

const H={};

/* --- Audio --- */
H.audio=()=>{
  let ctx,osc,mic,raf,play,url,peak=0,recTimer;
  const body=el(`<div>
    <p>1) Riproduci il tono: deve uscire pulito, senza fruscii o distorsioni. 2) Avvia il microfono e parla: il livello deve muoversi. 3) Registra 3 secondi e riascolta: verifica microfono e altoparlante insieme.</p>
    <div class="row wrap"><button class="btn" id="tone">▶︎ Tono 440 Hz</button><button class="btn" id="sweep">〰︎ Sweep 100–4000 Hz</button></div>
    <div class="row wrap" style="margin-top:8px"><button class="btn" id="mic">🎙️ Avvia microfono</button><button class="btn" id="rec">⏺ Registra 3 s</button><button class="btn" id="stop">Stop</button></div>
    <div class="field"><label class="small">Livello microfono — picco: <b id="peak">0%</b></label><div class="bar"><i id="lvl"></i></div></div>
    <audio id="play" controls hidden style="width:100%"></audio>
    <p class="small">Se non senti il tono controlla volume e interruttore Silenzioso. Se il microfono non parte, consenti l’accesso in Safari (aA → Impostazioni sito web).</p>
  </div>`);
  const bar=resultBar('audio');body.append(bar);
  const getCtx=()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume&&ctx.resume();return ctx};
  const stopOsc=()=>{try{osc&&osc.stop()}catch{}osc=null};
  const beep=(sweep)=>{
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch{}
    const c=getCtx();stopOsc();osc=c.createOscillator();const g=c.createGain();g.gain.value=.2;
    const t=c.currentTime;
    if(sweep){osc.frequency.setValueAtTime(100,t);osc.frequency.exponentialRampToValueAtTime(4000,t+3)}
    else osc.frequency.value=440;
    osc.connect(g).connect(c.destination);osc.start();osc.stop(t+(sweep?3:1.5));
  };
  $('#tone',body).onclick=()=>beep(false);$('#sweep',body).onclick=()=>beep(true);
  async function startMic(){
    if(mic)return true;
    try{
      mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const c=getCtx(),src=c.createMediaStreamSource(mic),an=c.createAnalyser();an.fftSize=512;src.connect(an);
      const data=new Uint8Array(an.fftSize),lvl=$('#lvl',body),pk=$('#peak',body);
      const loop=()=>{an.getByteTimeDomainData(data);let s=0;for(const v of data){const x=(v-128)/128;s+=x*x}const rms=Math.sqrt(s/data.length);peak=Math.max(peak,rms);lvl.style.width=Math.min(100,rms*300).toFixed(1)+'%';pk.textContent=Math.min(100,Math.round(peak*300))+'%';if(peak>.04)bar.suggest('ok');raf=requestAnimationFrame(loop)};
      loop();return true;
    }catch{toast('Microfono non disponibile o permesso negato');mic=null;return false}
  }
  const stopMic=()=>{cancelAnimationFrame(raf);if(mic){mic.getTracks().forEach(t=>t.stop());mic=null}};
  $('#mic',body).onclick=startMic;$('#stop',body).onclick=()=>{stopMic();stopOsc()};
  $('#rec',body).onclick=async()=>{
    if(typeof MediaRecorder==='undefined'){toast('Registrazione non supportata da questo browser');return}
    if(!await startMic())return;
    const chunks=[],r=new MediaRecorder(mic);
    r.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    r.onstop=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:r.mimeType||'audio/mp4'}));play=$('#play',body);play.src=url;play.hidden=false;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch{}play.play().catch(()=>{})};
    toast('Registro 3 secondi… parla ora');r.start();recTimer=setTimeout(()=>{try{r.stop()}catch{}},3000);
  };
  openSheet('Audio & Microfono',body,()=>{stopMic();stopOsc();clearTimeout(recTimer);if(url)URL.revokeObjectURL(url);try{ctx&&ctx.close()}catch{}});
};

/* --- Wireless --- */
H.wireless=()=>{
  const net=el(`<div><div class="row wrap"><button class="btn" id="run">Esegui test di rete</button></div><div class="field"><label class="small">Risultati</label><div id="out" class="small" aria-live="polite"></div></div></div>`);
  const out=$('#out',net);let netOk=!!state.wireless?.net?.ok,cl,bar;
  const upd=()=>{const c=cl.counts();bar.suggest(netOk&&c.n===c.t?'ok':null)};
  const ping=async u=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),5000),t=performance.now();try{await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{mode:'no-cors',cache:'no-store',signal:ac.signal});return performance.now()-t}catch{return NaN}finally{clearTimeout(to)}};
  $('#run',net).onclick=async()=>{
    out.textContent='Eseguo test…';
    const lines=[navigator.onLine?'✓ Il browser risulta online':'✗ Il browser risulta offline'];
    const c=navigator.connection;if(c)lines.push(`Rete: ${c.effectiveType||'?'} · ~${c.downlink||'?'} Mbps`);
    const urls=['https://www.apple.com/library/test/success.html','https://www.icloud.com','https://example.com'];
    let ok=0;const ms=[];
    for(const u of urls){const d=await ping(u);if(!isNaN(d)){ok++;ms.push(d)}lines.push(`${isNaN(d)?'✗':'✓'} ${new URL(u).host} → <b>${isNaN(d)?'errore':Math.round(d)+' ms'}</b>`)}
    out.innerHTML=lines.join('<br>');
    netOk=navigator.onLine&&ok===urls.length;
    patch('wireless',{net:{ok:netOk,reached:ok,of:urls.length,avgMs:ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):null}});
    upd();
  };
  const wrap=el('<div></div>');
  wrap.append(el('<p>Esegui il test di rete, poi verifica a mano le altre radio.</p>'),net);
  bar=resultBar('wireless');
  cl=checklist('wireless',[
    ['wifi','<b>Wi‑Fi</b>: si collega e naviga (prova anche 5 GHz)'],
    ['bt','<b>Bluetooth</b>: trova e si abbina a un accessorio'],
    ['sim','<b>SIM / dati mobili</b>: segnale presente e dati funzionanti'],
    ['call','<b>Chiamata di prova</b>: voce chiara con auricolare e vivavoce'],
    ['gps','<b>Posizione / GPS</b>: l’app Mappe trova la posizione']],upd);
  wrap.append(cl,bar);upd();
  openSheet('Wireless & rete',wrap);
};

/* --- Touch --- */
H.touch=()=>{
  const cols=6,rows=8;
  const body=el(`<div><p>Strisciando il dito colora tutte le celle. Usa anche 2–5 dita insieme per provare il multitouch.</p>
    <canvas id="cv" style="width:100%;aspect-ratio:3/4;touch-action:none;background:#fff" aria-label="Griglia test touch"></canvas>
    <div class="row" style="justify-content:space-between;margin-top:6px"><span class="small" id="cov">0%</span><span class="small" id="mt">Dita simultanee: 0 (max 0)</span></div>
    <div class="row wrap" style="margin-top:8px"><button class="btn" id="reset">Reset</button></div></div>`);
  body.append(resultBar('touch'));
  openSheet('Touch screen',body);
  const cv=$('#cv',body),g=cv.getContext('2d'),dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientWidth*4/3*dpr);
  let filled,active=new Set(),last=new Map(),maxMt=0,done=false,timer;
  const reset=()=>{filled=Array.from({length:rows},()=>Array(cols).fill(false));done=false;draw();info()};
  const count=()=>filled.flat().filter(Boolean).length;
  function draw(){
    const w=cv.width/cols,h=cv.height/rows;g.clearRect(0,0,cv.width,cv.height);g.lineWidth=1;g.strokeStyle='#cbd5e1';
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){g.fillStyle=filled[y][x]?'#bbf7d0':'#f1f5f9';g.fillRect(x*w,y*h,w,h);g.strokeRect(x*w+.5,y*h+.5,w,h)}
  }
  function info(){$('#cov',body).textContent=`${Math.round(count()/(cols*rows)*100)}% delle celle`;$('#mt',body).textContent=`Dita simultanee: ${active.size} (max ${maxMt})`}
  const hit=(x,y)=>{const cx=Math.floor(x*cols),cy=Math.floor(y*rows);if(cx>=0&&cy>=0&&cx<cols&&cy<rows&&!filled[cy][cx]){filled[cy][cx]=true;return true}return false};
  const norm=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  function stroke(e){
    const p=norm(e),l=last.get(e.pointerId)||p,n=Math.ceil(Math.hypot((p[0]-l[0])*cols,(p[1]-l[1])*rows)*3)+1;let ch=false;
    for(let i=0;i<=n;i++){const t=i/n;ch=hit(l[0]+(p[0]-l[0])*t,l[1]+(p[1]-l[1])*t)||ch}
    last.set(e.pointerId,p);
    if(ch){draw();info();if(!done&&count()===cols*rows){done=true;patch('touch',{coverage:100,multitouch:maxMt});setStatus('touch','ok');toast('Touch OK ✓');timer=setTimeout(closeSheet,900)}}
  }
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch{}active.add(e.pointerId);maxMt=Math.max(maxMt,active.size);last.set(e.pointerId,norm(e));stroke(e);info()};
  cv.onpointermove=e=>{if(active.has(e.pointerId))stroke(e)};
  const up=e=>{active.delete(e.pointerId);last.delete(e.pointerId);info()};
  cv.onpointerup=up;cv.onpointercancel=up;
  $('#reset',body).onclick=reset;reset();
  sheetCleanup=()=>clearTimeout(timer);
};

/* --- Sensori --- */
H.sensors=()=>{
  let on=false,rng={x:[1e9,-1e9],y:[1e9,-1e9],z:[1e9,-1e9]},gyroMax=0,orient={b:0,g:0},raf,bar,cl;
  const body=el(`<div><p>Premi «Avvia» (iOS chiede il permesso), poi inclina, ruota e scuoti il telefono: i valori devono cambiare in modo fluido.</p>
    <div class="row wrap"><button class="btn primary" id="go">Avvia sensori</button><button class="btn" id="stop">Stop</button></div>
    <div class="level" aria-hidden="true"><i id="dot"></i></div>
    <div class="mono small" id="vals">—</div><div class="small" id="verdict" style="margin-top:6px"></div></div>`);
  const span=a=>a[1]-a[0];
  const accelOk=()=>Math.max(span(rng.x),span(rng.y),span(rng.z))>1.5,gyroOk=()=>gyroMax>20;
  const sug=()=>{const c=cl.counts();bar.suggest(accelOk()&&gyroOk()&&c.n===c.t?'ok':null)};
  const onMotion=e=>{
    const a=e.accelerationIncludingGravity||{},r=e.rotationRate||{};
    for(const k of ['x','y','z']){const v=a[k];if(typeof v==='number'){rng[k][0]=Math.min(rng[k][0],v);rng[k][1]=Math.max(rng[k][1],v)}}
    gyroMax=Math.max(gyroMax,Math.abs(r.alpha||0),Math.abs(r.beta||0),Math.abs(r.gamma||0));
    body._a=a;body._r=r;
  };
  const onOrient=e=>{orient={b:e.beta||0,g:e.gamma||0}};
  const f=v=>typeof v==='number'?v.toFixed(2).padStart(7):'    n/d';
  const tick=()=>{
    const a=body._a||{},r=body._r||{};
    $('#vals',body).textContent=`Accelerometro  x ${f(a.x)}  y ${f(a.y)}  z ${f(a.z)} m/s²\nGiroscopio     α ${f(r.alpha)}  β ${f(r.beta)}  γ ${f(r.gamma)} °/s\nOrientamento   β ${f(orient.b)}°  γ ${f(orient.g)}°`;
    const cl2=(v,m)=>Math.max(-m,Math.min(m,v));
    $('#dot',body).style.left=(50+cl2(orient.g,45)/45*40)+'%';$('#dot',body).style.top=(50+cl2(orient.b,45)/45*40)+'%';
    $('#verdict',body).textContent=`Accelerometro: ${accelOk()?'✓ movimento rilevato':'… muovi il telefono'} · Giroscopio: ${gyroOk()?'✓ rotazione rilevata':'… ruotalo'}`;
    sug();raf=requestAnimationFrame(tick);
  };
  const stop=()=>{on=false;cancelAnimationFrame(raf);window.removeEventListener('devicemotion',onMotion);window.removeEventListener('deviceorientation',onOrient)};
  $('#go',body).onclick=async()=>{
    if(typeof DeviceMotionEvent==='undefined'){toast('Sensori non disponibili in questo browser');return}
    try{
      if(typeof DeviceMotionEvent.requestPermission==='function'){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted'){toast('Permesso sensori negato');return}}
      if(on)return;on=true;window.addEventListener('devicemotion',onMotion);window.addEventListener('deviceorientation',onOrient);tick();
    }catch{toast('Impossibile avviare i sensori (serve una connessione HTTPS)')}
  };
  $('#stop',body).onclick=stop;
  bar=resultBar('sensors');
  cl=checklist('sensors',[
    ['rotate','<b>Rotazione automatica</b> dello schermo (verticale/orizzontale)'],
    ['prox','<b>Prossimità</b>: in chiamata lo schermo si spegne vicino all’orecchio'],
    ['compass','<b>Bussola</b>: l’app Bussola punta correttamente e si calibra'],
    ['light','<b>Luminosità automatica</b> reagisce alla luce']],sug);
  body.append(cl,bar);
  openSheet('Sensori',body,stop);
};

/* --- Batteria --- */
H.battery=()=>{
  const b=state.battery||{};
  const body=el(`<div><p>Safari su iOS non espone la batteria: inserisci i dati da <span class="kbd">Impostazioni → Batteria → Stato batteria</span>.</p>
    <div class="row wrap"><div class="field half"><label class="small" for="cap">Capacità massima (%)</label><input id="cap" type="number" inputmode="numeric" min="1" max="110" placeholder="es. 92" /></div>
    <div class="field half"><label class="small" for="cyc">Cicli di carica (se noto)</label><input id="cyc" type="number" inputmode="numeric" min="0" placeholder="—" /></div></div>
    <div class="checks"><label><input type="checkbox" id="svc" /><span>Compare «Assistenza batteria» / «Verifica non riuscita» / batteria non originale</span></label></div>
    <div class="card" id="eval" style="margin-top:10px" aria-live="polite">Inserisci la capacità per ottenere la valutazione.</div>
    <div class="field"><label class="small" for="bnote">Nota facoltativa</label><input id="bnote" maxlength="200" /></div>
    <div class="row wrap"><button class="btn primary" id="save">Salva &amp; valuta</button><button class="btn ghost" id="clear">Azzera esito</button></div></div>`);
  const cap=$('#cap',body),cyc=$('#cyc',body),svc=$('#svc',body),note=$('#bnote',body);
  cap.value=b.cap||'';cyc.value=b.cycles||'';svc.checked=!!b.serviceMsg;note.value=b.note||'';
  const evaluate=()=>{
    const c=parseFloat(cap.value),cy=parseInt(cyc.value,10);let s=null,why=[];
    if(!isNaN(c)){s=c>=85?'ok':c>=80?'warn':'bad';why.push(`Capacità ${c}% ${c>=85?'(buona)':c>=80?'(vicina alla soglia di sostituzione)':'(sotto l’80%: batteria da sostituire)'}`)}
    if(!isNaN(cy)&&cy>=1000){if(s==='ok')s='warn';why.push(`${cy} cicli (molto usata)`)}
    if(svc.checked){if(s!=='bad')s='warn';why.push('Messaggio di assistenza presente')}
    return {s,why};
  };
  const show=()=>{const e=evaluate();$('#eval',body).innerHTML=e.s?`<b class="st ${e.s}">${LABEL[e.s]}</b> — ${esc(e.why.join(' · '))}`:'Inserisci la capacità per ottenere la valutazione.'};
  [cap,cyc,svc].forEach(x=>x.addEventListener('input',show));show();
  $('#save',body).onclick=()=>{const e=evaluate();if(!e.s)return toast('Inserisci almeno la capacità massima');patch('battery',{cap:cap.value,cycles:cyc.value,serviceMsg:svc.checked,note:note.value.trim()});setStatus('battery',e.s);closeSheet()};
  $('#clear',body).onclick=()=>{setStatus('battery',null);closeSheet()};
  openSheet('Batteria',body);
};

/* --- Memoria --- */
H.storage=()=>{
  const CAPS=[64,128,256,512,1024,2048],st=state.storage||{};
  const opts=sel=>`<option value="">—</option>`+CAPS.map(c=>`<option value="${c}" ${String(sel)===String(c)?'selected':''}>${c>=1024?c/1024+' TB':c+' GB'}</option>`).join('');
  const wrap=el(`<div><p>Confronta la capacità dichiarata dal venditore con quella mostrata dal telefono (<span class="kbd">Generali → Info → Capacità</span> e <span class="kbd">Spazio iPhone</span>). Una differenza indica un dispositivo manomesso o descritto male.</p>
    <div class="row wrap"><div class="field half"><label class="small" for="decl">Capacità dichiarata</label><select id="decl">${opts(st.declared)}</select></div>
    <div class="field half"><label class="small" for="shown">Capacità mostrata</label><select id="shown">${opts(st.shown)}</select></div></div>
    <div class="card" id="cmp" aria-live="polite"></div>
    <div class="row wrap"><button class="btn" id="est">Stima spazio del browser (indicativa)</button></div><div class="small" id="est-out" style="margin:6px 0"></div></div>`);
  const bar=resultBar('storage');
  let cl;
  const sug=()=>{
    const d=$('#decl',wrap).value,s=$('#shown',wrap).value,c=cl.counts();
    patch('storage',{declared:d,shown:s});
    $('#cmp',wrap).innerHTML=!d||!s?'Seleziona entrambe le capacità.':d===s?'<b class="st ok">✓ Coincidono</b>':'<b class="st bad">✕ Non coincidono</b> — verifica con il numero di modello (Generali → Info).';
    bar.suggest(d&&s&&d!==s?'bad':(d&&s&&c.n===c.t?'ok':null));
  };
  cl=checklist('storage',[['load','<b>Spazio iPhone</b> si carica senza errori'],['write','<b>Scrittura</b>: una foto o un video appena registrati si salvano e riaprono correttamente']],sug);
  $('#decl',wrap).onchange=sug;$('#shown',wrap).onchange=sug;
  $('#est',wrap).onclick=async()=>{const o=$('#est-out',wrap);if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();o.innerHTML=`Quota del browser: <b>${fmtBytes(e.quota||0)}</b> · in uso: <b>${fmtBytes(e.usage||0)}</b> (non è la memoria dell’iPhone)`}else o.textContent='API non disponibile su questo browser.'};
  wrap.append(cl,bar);sug();
  openSheet('Memoria interna',wrap);
};

/* --- Log & crash --- */
const LOG_RULES=[
  ['panic-full|kernel panic|cpu panic|smc panic|panicstring','Kernel panic','bad'],
  ['watchdog','Watchdog timeout','bad'],
  ['\\bnand\\b','Errori memoria NAND','bad'],
  ['baseband','Baseband / modem','warn'],
  ['thermal|overheat','Eventi termici','warn'],
  ['jetsam|lowmemory|low memory','Memoria insufficiente (jetsam)','warn'],
  ['shutdown cause|unexpected shutdown|spontaneous reset','Spegnimenti anomali','warn'],
  ['\\bi2c\\b','Errori bus I²C','warn']
];
H.logs=()=>{
  const body=el(`<div><p>Opzionale: carica uno o più file di log iOS (Impostazioni → Privacy e sicurezza → Analisi e miglioramenti → Dati analisi → condividi). L’analisi avviene <b>sul dispositivo</b>: nessun dato viene inviato.</p>
    <input type="file" id="file" multiple aria-label="Carica file di log" />
    <div class="field"><label class="small">Esiti</label><div id="out" class="small" aria-live="polite"></div></div></div>`);
  body.append(resultBar('logs'));
  const out=$('#out',body),prev=state.logs?.summary;
  const showSum=(sum,files)=>{out.innerHTML=`<div>${files} file analizzati</div><table class="tbl">${sum.map(r=>`<tr><td>${esc(r.label)}</td><td>${r.count}</td><td class="st ${r.count?r.sev:'ok'}">${r.count?LABEL[r.sev]:'—'}</td></tr>`).join('')}</table>`};
  if(prev)showSum(prev,state.logs.files||0);
  $('#file',body).addEventListener('change',async e=>{
    const files=[...e.target.files];if(!files.length)return;
    out.textContent='Analizzo…';
    const sum=LOG_RULES.map(([,label,sev])=>({label,sev,count:0}));
    for(const f of files){const txt=await f.text();LOG_RULES.forEach(([p],i)=>{sum[i].count+=(txt.match(new RegExp(p,'gi'))||[]).length})}
    showSum(sum,files.length);
    const crit=sum.some(r=>r.sev==='bad'&&r.count),warn=sum.some(r=>r.sev==='warn'&&r.count);
    patch('logs',{summary:sum,files:files.length});setStatus('logs',crit?'bad':warn?'warn':'ok');
    toast(crit?'Rilevati errori critici':warn?'Rilevati avvisi':'Nessun pattern critico');
  });
  openSheet('Log & crash',body);
};

H.device=()=>{

  const body=el(`<div><p>I browser non possono leggere modello e numeri di serie: indicali a mano da <span class="kbd">Generali → Info</span> (l’IMEI si vede anche digitando <span class="kbd">*#06#</span>).</p>

    <div class="row wrap"><div class="field half"><label class="small" for="dsn">Numero di serie</label><input id="dsn" autocapitalize="characters" autocomplete="off" /></div>
    <div class="field half"><label class="small" for="dimei">IMEI (15 cifre)</label><input id="dimei" inputmode="numeric" autocomplete="off" maxlength="15" /></div></div>
    <div class="small" id="valid" aria-live="polite"></div>
    <div class="field"><label class="small">Info browser</label><textarea rows="2" readonly>${esc(navigator.userAgent)}</textarea></div></div>`);
  const bar=resultBar('device');body.append(bar);
  const f={model:$('#dm',body),ios:$('#dv',body),sn:$('#dsn',body),imei:$('#dimei',body)};
  for(const k in f)f[k].value=d[k]||'';
  const validate=()=>{
    const im=f.imei.value.trim(),sn=f.sn.value.trim(),msg=[];let all=true;
    if(im){if(/^\d{15}$/.test(im)&&luhn(im))msg.push('✓ IMEI valido (checksum corretto)');else{msg.push('✕ IMEI non valido (15 cifre + checksum)');all=false}}else all=false;
    if(sn){if(/^[A-Z0-9]{8,14}$/i.test(sn))msg.push('✓ Formato numero di serie plausibile');else{msg.push('! Il numero di serie ha un formato insolito');all=false}}else all=false;
    if(!f.model.value.trim())all=false;
    $('#valid',body).innerHTML=msg.join('<br>');bar.suggest(all?'ok':null);
  };
  for(const k in f)f[k].addEventListener('input',()=>{patch('device',{[k]:f[k].value.trim()});validate()});
  validate();
  openSheet('Info dispositivo',body);
};

/* ===================== Report ===================== */
function assembleReport(){
  const score=computeScore(),results={};
  for(const t of TESTS)results[t.id]={status:null,...(state[t.id]||{})};
  const core={app:'2M iPhone Check Tool',version:'2.0',id:state.id,startedAt:new Date(state.startedAt||Date.now()).toISOString(),timestamp:new Date().toISOString(),
    customer:state.customer||'',device:{model:state.device?.model||'',sn:state.device?.sn||'',imei:state.device?.imei||'',ios:state.device?.ios||''},score,results,notes:state.notes||''};
  core.checksum=cyrb53(JSON.stringify([core.id,core.customer,core.device,TESTS.map(t=>results[t.id].status),core.notes]));
  return {...core,signature:state.signature||null};
}
function asTxt(r){
  const L=['2M Digital Consulting — iPhone Check Tool — Report',`ID ${r.id}  ·  ${fmtDate(r.timestamp)}`,''];
  L.push(`Cliente: ${r.customer||'—'}`,`Dispositivo: ${r.device.model||'—'}  ·  iOS ${r.device.ios||'—'}`,`Seriale: ${r.device.sn||'—'}  ·  IMEI: ${r.device.imei||'—'}`,'','Esiti test:');
  for(const t of TESTS){const x=r.results[t.id];L.push(`- ${t.title}: ${x.status?LABEL[x.status]:'non eseguito'}${x.note?' — '+x.note:''}`)}
  const b=r.results.battery||{},s=r.results.storage||{};
  L.push('',`Batteria: capacità max ${b.cap||'—'}%  ·  cicli ${b.cycles||'—'}${b.serviceMsg?'  ·  messaggio di assistenza':''}`);
  if(s.declared||s.shown)L.push(`Memoria: dichiarata ${s.declared||'—'} GB  ·  mostrata ${s.shown||'—'} GB`);
  L.push('','Note:',r.notes||'—','',`Punteggio complessivo: ${r.score.percent}% (${r.score.verdict}) — ${r.score.done}/${r.score.total} test eseguiti`,`Codice di controllo: ${r.checksum}`,r.signature?'Firmato dal cliente: sì':'Firma cliente: assente');
  return L.join('\n');
}
function qrPayload(r){
  const ab={ok:'OK',warn:'AT',bad:'KO'};
  return ['2M-CHECK v2',`ID ${r.id}`,`Data ${fmtDate(r.timestamp)}`,r.customer?`Cliente ${r.customer.slice(0,60)}`:'',
    `${r.device.model||'iPhone'} SN ${r.device.sn||'-'} IMEI ${r.device.imei||'-'}`,
    `Punteggio ${r.score.percent}% ${r.score.verdict} (${r.score.done}/${r.score.total})`,
    TESTS.map(t=>`${t.id}:${ab[r.results[t.id].status]||'--'}`).join(' '),`Chk ${r.checksum}`].filter(Boolean).join('\n');
}
function drawQR(text,px=240){
  try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8']}catch{}
  const q=qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),quiet=4,cell=Math.max(3,Math.floor(px/(n+quiet*2))),size=(n+quiet*2)*cell;
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle='#000';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))g.fillRect((x+quiet)*cell,(y+quiet)*cell,cell,cell);
  return c;
}
function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function shareText(name,content){
  const f=new File([content],name,{type:'text/plain'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  download(name,content,'text/plain');
}
const fileBase=r=>`iphone-check-${slug(r.device.model)||'report'}-${r.timestamp.slice(0,10).replaceAll('-','')}`;

function buildPrint(r){
  let qr='';try{qr=drawQR(qrPayload(r),260).toDataURL('image/png')}catch{}
  const rows=TESTS.map(t=>{const x=r.results[t.id];return `<tr><td>${t.icon} ${esc(t.title)}</td><td class="st ${x.status||'none'}">${x.status?LABEL[x.status]:'—'}</td><td>${esc(x.note||'')}</td></tr>`}).join('');
  const b=r.results.battery||{},s=r.results.storage||{};
  $('#printReport').innerHTML=`
    <div class="ph"><div><h1>iPhone Check — Report di verifica</h1><div>2M Digital Consulting SRLS — www.2m-srls.com</div></div><div style="text-align:right">ID <b>${esc(r.id)}</b><br>${fmtDate(r.timestamp)}</div></div>
    <table><tr><th>Cliente</th><td>${esc(r.customer||'—')}</td><th>Modello</th><td>${esc(r.device.model||'—')}</td></tr>
    <tr><th>N. di serie</th><td>${esc(r.device.sn||'—')}</td><th>IMEI</th><td>${esc(r.device.imei||'—')}</td></tr>
    <tr><th>iOS</th><td>${esc(r.device.ios||'—')}</td><th>Batteria</th><td>${b.cap?esc(b.cap)+'%':'—'}${b.cycles?' · '+esc(b.cycles)+' cicli':''}</td></tr>
    ${s.declared||s.shown?`<tr><th>Memoria</th><td colspan="3">dichiarata ${esc(s.declared||'—')} GB · mostrata ${esc(s.shown||'—')} GB</td></tr>`:''}</table>
    <p><b>Esito complessivo: ${r.score.percent}% — ${esc(r.score.verdict)}</b> (${r.score.done}/${r.score.total} test eseguiti)</p>
    <table><thead><tr><th>Test</th><th>Esito</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>
    ${r.notes?`<p><b>Note finali</b><br>${esc(r.notes).replace(/\n/g,'<br>')}</p>`:''}
    <div class="pf"><div><div style="height:90px;border-bottom:1px solid #000;display:flex;align-items:flex-end">${r.signature?`<img src="${r.signature}" alt="Firma" style="max-height:88px">`:''}</div><div>Firma del cliente${r.customer?' — '+esc(r.customer):''}</div></div>
    <div style="flex:0 0 130px;text-align:center">${qr?`<img src="${qr}" alt="QR" width="130" height="130"><div style="font-size:10px">Codice di controllo ${esc(r.checksum)}</div>`:''}</div></div>
    <div class="legal">Verifica funzionale non invasiva eseguita tramite browser. Non sostituisce la diagnostica ufficiale Apple né una perizia tecnica. I dati sono stati elaborati sul dispositivo.</div>`;
}
function printReport(r){buildPrint(r);setTimeout(()=>window.print(),60)}

/* --- Cronologia --- */
function archive(rep){
  rep=rep||assembleReport();
  if(!rep.score.done&&!rep.customer)return;
  const h=jget(HKEY,[]),i=h.findIndex(x=>x.id===rep.id);
  if(i>=0)h[i]=rep;else h.unshift(rep);
  if(!jset(HKEY,h.slice(0,30)))toast('Memoria piena: impossibile salvare in cronologia');
}
function loadReport(r){
  const s={id:r.id,startedAt:Date.parse(r.startedAt)||Date.now(),customer:r.customer,notes:r.notes};
  if(r.signature)s.signature=r.signature;
  for(const t of TESTS)s[t.id]=r.results[t.id]||{};
  state=s;persist();render();
}
function showHistory(){
  const h=jget(HKEY,[]);
  const body=el(`<div><p>Gli ultimi 30 controlli salvati su questo dispositivo.</p><div id="list"></div><div class="row wrap" style="margin-top:12px"><button class="btn" id="all">Esporta tutto (.json)</button></div></div>`);
  const list=$('#list',body);
  const draw=()=>{
    const hh=jget(HKEY,[]);
    list.innerHTML=hh.length?hh.map((r,i)=>`<div class="hrow"><div><b>${esc(r.customer||'Senza nome')}</b> · ${esc(r.device.model||'iPhone')}<div class="small">${fmtDate(r.timestamp)} · ${r.score.percent}% ${esc(r.score.verdict)} · ID ${esc(r.id)}</div></div>
      <div class="row wrap"><button class="btn" data-a="open" data-i="${i}">Riapri</button><button class="btn" data-a="txt" data-i="${i}">TXT</button><button class="btn" data-a="json" data-i="${i}">JSON</button><button class="btn" data-a="pdf" data-i="${i}">PDF</button><button class="btn bad" data-a="del" data-i="${i}" aria-label="Elimina">🗑</button></div></div>`).join(''):'<div class="small">Nessun controllo salvato.</div>';
  };
  draw();
  list.onclick=e=>{
    const b=e.target.closest('button[data-a]');if(!b)return;
    const hh=jget(HKEY,[]),r=hh[+b.dataset.i];if(!r)return;
    switch(b.dataset.a){
      case 'txt':shareText(fileBase(r)+'.txt',asTxt(r));break;
      case 'json':download(fileBase(r)+'.json',JSON.stringify(r,null,2),'application/json');break;
      case 'pdf':printReport(r);break;
      case 'del':if(confirm('Eliminare questo controllo dalla cronologia?')){hh.splice(+b.dataset.i,1);jset(HKEY,hh);draw()}break;
      case 'open':if(confirm('Riaprire questo controllo? Quello attuale viene salvato in cronologia.')){archive();loadReport(r);closeSheet();toast('Controllo riaperto')}break;
    }
  };
  $('#all',body).onclick=()=>{if(!h.length)return toast('Cronologia vuota');download('iphone-check-cronologia.json',JSON.stringify(jget(HKEY,[]),null,2),'application/json')};
  openSheet('Cronologia',body);
}

/* --- Finalizza --- */
function showFinalize(){
  const rep=assembleReport();archive(rep);
  const sc=rep.score,missing=TESTS.filter(t=>!rep.results[t.id].status).map(t=>t.title);
  const rows=TESTS.map(t=>{const x=rep.results[t.id];return `<tr><td>${t.icon} ${esc(t.title)}</td><td class="st ${x.status||'none'}">${x.status?LABEL[x.status]:'—'}</td></tr>`}).join('');
  const body=el(`<div>
    <div class="row wrap" style="gap:8px;margin:8px 0">
      <div class="badge">Punteggio: <b>${sc.percent}%</b> (${esc(sc.verdict)})</div>
      <div class="badge">Test eseguiti: <b>${sc.done}</b>/<b>${sc.total}</b></div>
    </div>
    ${missing.length?`<p>⚠️ Test non eseguiti: ${esc(missing.join(', '))}. Il punteggio è provvisorio.</p>`:''}
    <table class="tbl">${rows}</table>
    <div class="field"><label class="small">Firma del cliente (accetta l’esito del controllo)</label><canvas class="sig" id="sig" aria-label="Area firma"></canvas>
      <div class="row"><button class="btn" id="sigClear">Cancella firma</button></div></div>
    <div class="field"><label class="small">QR di riepilogo (ID, dispositivo, esiti e codice di controllo)</label><div id="qrBox" class="center"></div>
      <div class="small center">Scansionandolo con la fotocamera dell’iPhone compare il riepilogo in chiaro.</div></div>
    <div class="row wrap" id="acts"></div></div>`);
  const acts=$('#acts',body);
  const btn=(t,fn,cls='')=>{const b=el(`<button class="btn ${cls}">${t}</button>`);b.onclick=fn;acts.append(b)};
  btn('🖨 Stampa / PDF',()=>printReport(assembleReport()),'primary');
  if(navigator.share)btn('↗︎ Condividi report',()=>{const r=assembleReport();shareText(fileBase(r)+'.txt',asTxt(r))});
  btn('Esporta .txt',()=>{const r=assembleReport();download(fileBase(r)+'.txt',asTxt(r),'text/plain')});
  btn('Esporta .json',()=>{const r=assembleReport();download(fileBase(r)+'.json',JSON.stringify(r,null,2),'application/json')});
  openSheet('Esito & report',body);
  try{const qc=drawQR(qrPayload(rep));qc.style.cssText='width:100%;max-width:240px;height:auto;border:1px solid var(--border)';$('#qrBox',body).append(qc)}catch{$('#qrBox',body).textContent='Impossibile generare il QR.'}
  /* area firma */
  const cv=$('#sig',body),g=cv.getContext('2d'),dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(150*dpr);
  g.lineWidth=2.2*dpr;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0f172a';
  if(state.signature){const im=new Image();im.onload=()=>g.drawImage(im,0,0,cv.width,cv.height);im.src=state.signature}
  let drawing=false,lp=null,dirty=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch{}drawing=true;lp=pt(e);g.beginPath();g.moveTo(...lp);g.lineTo(lp[0]+.1,lp[1]);g.stroke()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.beginPath();g.moveTo(...lp);g.lineTo(...p);g.stroke();lp=p;dirty=true};
  const end=()=>{if(!drawing)return;drawing=false;if(dirty){setState({signature:cv.toDataURL('image/png')});archive();dirty=false}};
  cv.onpointerup=end;cv.onpointercancel=end;
  $('#sigClear',body).onclick=()=>{g.clearRect(0,0,cv.width,cv.height);const s={...state};delete s.signature;state=s;persist();render();archive()};
}

/* ===================== Nuovo controllo ===================== */
function newCheck(){
  if(!confirm('Archiviare questo controllo in cronologia e iniziarne uno nuovo?'))return;
  archive();
  state={id:newId(),startedAt:Date.now()};persist();render();window.scrollTo({top:0,behavior:'smooth'});toast('Nuovo controllo avviato');
}
$('#btnNew').onclick=newCheck;
$('#btnHist').onclick=showHistory;
$('#btnFinal').onclick=showFinalize;

/* ===================== Avvio ===================== */
render();
(function installTip(){
  try{
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(ios&&!standalone&&!localStorage.getItem('iphone_check_tip'))$('#install').hidden=false;
    $('#tipClose').onclick=()=>{$('#install').hidden=true;try{localStorage.setItem('iphone_check_tip','1')}catch{}};
  }catch{}
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
